[project]
name = "lucerouter"
version = "0.1.0"
description = "Model-routing gateway prototype for the Lucebox local inference box"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Offline eval pipeline (eval/): dataset download for build_set.py.
eval = ["datasets>=2.19", "pyarrow>=15"]
# brick_skill router: the Brick ModernBERT capability classifier, run on CPU in-process.
# torch comes from the CPU-only wheel index (see [tool.uv.sources]).
brick = ["torch>=2.4", "transformers>=4.48"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "brick" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucerouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

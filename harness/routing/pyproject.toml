[project]
name = "lucerouter"
version = "0.1.0"
description = "Model-routing gateway prototype for the Lucebox local inference box"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Offline eval pipeline (eval/): dataset download for build_set.py.
eval = ["datasets>=2.19", "pyarrow>=15"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucerouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

name: Formal Verification Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-nightly
  cancel-in-progress: true

jobs:
  verify-nightly:
    name: verify-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        name: Generate extended base-approved plan
        continue-on-error: true
        env:
          VERIFIER_IMAGE: ghcr.io/dusterbloom/lucebox-esbmc-ai-verifier@sha256:9321a4aa371efec1b55e33dff0c1cefbc10778aa7f38b07cb2b84cff1c9ed39e
          REPAIR_IMAGE: ghcr.io/dusterbloom/lucebox-esbmc-ai-repair@sha256:e33712eac4207a74562fe9d9fda9a9456ce41c175456dda3dd54e7ba7286c597
          REVISION: ${{ github.sha }}
        run: |
          readarray -t policy_images < <(
            git show "$REVISION:formal/contracts/registry.toml" |
              python3 -c '
          import sys
          import tomllib
          toolchain = tomllib.loads(sys.stdin.read())["toolchain"]
          print(toolchain["verifier_image"])
          print(toolchain["repair_image"])
          '
          )
          if [[ "${#policy_images[@]}" -ne 2 ]] ||
             [[ "${policy_images[0]}" != "$VERIFIER_IMAGE" ]] ||
             [[ "${policy_images[1]}" != "$REPAIR_IMAGE" ]];
          then
            echo "Nightly images do not match trusted policy." >&2
            exit 13
          fi
          mkdir -p .formal-plan
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 1 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/.formal-plan:/plan:rw" \
            --workdir /workspace \
            "$VERIFIER_IMAGE" plan \
            --workspace /workspace \
            --base-policy formal/contracts/registry.toml \
            --base-sha "$REVISION" \
            --head-sha "$REVISION" \
            --mode nightly \
            --out /plan

      - id: formal
        name: Run extended generated contracts
        if: steps.plan.outcome == 'success'
        continue-on-error: true
        env:
          VERIFIER_IMAGE: ghcr.io/dusterbloom/lucebox-esbmc-ai-verifier@sha256:9321a4aa371efec1b55e33dff0c1cefbc10778aa7f38b07cb2b84cff1c9ed39e
        run: |
          mkdir -p .formal-results
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 6g \
            --cpus 2 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/.formal-plan:/plan:ro" \
            --volume "$GITHUB_WORKSPACE/.formal-results:/results:rw" \
            --workdir /workspace \
            "$VERIFIER_IMAGE" verify \
            --plan /plan/plan.json \
            --workspace /workspace \
            --generated-root /plan \
            --out /results

      - id: legacy
        name: Run legacy nightly capsules for comparison
        continue-on-error: true
        env:
          VERIFIER_IMAGE: ghcr.io/dusterbloom/lucebox-esbmc-ai-verifier@sha256:9321a4aa371efec1b55e33dff0c1cefbc10778aa7f38b07cb2b84cff1c9ed39e
        run: |
          mkdir -p .formal-legacy-results
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 6g \
            --cpus 2 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/.formal-legacy-results:/results:rw" \
            --workdir /workspace \
            "$VERIFIER_IMAGE" verify \
            --manifest /workspace/formal/manifest.toml \
            --mode nightly \
            --out /results

      - name: Publish formal summary
        if: always()
        run: |
          if [[ -f .formal-results/summary.md ]]; then
            cat .formal-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nightly plan did not produce a summary." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Legacy comparison: \`${{ steps.legacy.outcome }}\`" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: formal-nightly-results
          path: |
            .formal-plan/
            .formal-results/
            .formal-legacy-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Enforce extended result
        if: >-
          steps.plan.outcome != 'success' ||
          steps.formal.outcome != 'success'
        run: exit 1

  mutation-sensitivity:
    name: mutation-sensitivity
    needs: verify-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the historical call-site regression to fail
        run: scripts/formal_mutation_test.sh

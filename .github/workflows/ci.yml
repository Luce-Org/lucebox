name: CI

on:
  pull_request:
    branches: [main]
  # Merge queue runs the full suite (--full) before anything lands on main.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'harness/**'
      - 'optimizations/**'
      - 'share/model_cards/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
      - '.github/ci/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs (opened/synchronize/reopened, attempt 1) so pushes
# don't pile up on the same PR, while giving main pushes, merge_group, manual
# dispatches, and reruns their own workflow group. Sharing one workflow group
# across main pushes blocked hosted sccache-seeding builds for 8-24h whenever
# lucebox3 had a queue backlog or went offline.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) && format('pr-latest-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) }}

jobs:
  plan:
    name: Plan CI jobs from changed files
    # Narrow PR feedback to what the diff can affect (.github/ci/ci_plan.py).
    # Pushes to main, merge_group checks, manual dispatches, unknown paths,
    # and any planning failure fall back to running everything (`!= 'false'`).
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      python: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.python || '' }}
      cpp: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.cpp || '' }}
      megakernel: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.megakernel || '' }}
      windows: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.windows || '' }}
      dgx: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.dgx || '' }}
      gpu: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.gpu || '' }}
      qwen38: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.qwen38 || '' }}
      ds41: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.ds41 || '' }}
    steps:
      # A pull request checks out its merge commit: parent 1 is main, so the diff
      # from it is what the pull request changes.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
          sparse-checkout: .github/ci

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 .github/ci/ci_plan.py --base HEAD^1 --head HEAD >> "$GITHUB_OUTPUT"
          else
            python3 .github/ci/ci_plan.py --full >> "$GITHUB_OUTPUT"
          fi

  uv-workspace:
    name: uv workspace (lock + sync + import smoke)
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # setup-uv reads uv's version list from raw.githubusercontent.com once, with a
      # fixed 5-second timeout and no retry (an exact version still reads it, to find
      # the download), so a slow fetch fails the job before any work. Try it twice.
      - id: setup-uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        continue-on-error: true
        with:
          version: "0.11.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify uv lockfile and workspace sync
        # Installs dev tooling in the same sync pass (skipping the torch wheel;
        # build-megakernel below runs the cu128 torch sync).
        env:
          UV_WORKSPACE_SYNC_ARGS: "--extra dev --no-install-package torch"
        run: bash scripts/check_uv_workspace.sh

      - name: Lint Python surfaces and CI helper scripts
        run: |
          uv run --frozen --no-sync ruff check .
          find .github/ci -name '*.py' -print0 | xargs -0 uv run --frozen --no-sync ruff check

      - name: Python unit tests (no GPU/server/model required)
        # Includes .github/ci. server/model/slow-marked tests need a running
        # luce_server or local model files; no CI job runs them yet, so run
        # them by hand with --base-url/--launch.
        run: uv run --frozen --no-sync pytest -q -m "not server and not model and not slow"

  build:
    name: Build (cmake + C++ CPU unit tests)
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.cpp != 'false' }}
    # ubuntu-latest is Ubuntu 26.04, whose NVIDIA apt repository has no CUDA 12.8 packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Add a last-resort Ubuntu mirror outside Canonical's DNS
        # The CUDA install below runs apt. The runner reads its Ubuntu mirrors from
        # /etc/apt/apt-mirrors.txt and tries them in priority order, but all three are
        # ubuntu.com names, so a Canonical DNS outage fails every apt install. kernel.org
        # mirrors the same signed archive (apt still checks it against the Ubuntu keys) and
        # is only reached when the three runner mirrors fail.
        run: printf 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:4\n' | sudo tee -a /etc/apt/apt-mirrors.txt

      - uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc", "cudart-dev", "thrust", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas-dev"]'

      - name: Provide CUDA driver stub for hosted tests
        run: |
          mkdir -p "$RUNNER_TEMP/cuda-stubs"
          ln -sf "$CUDA_PATH/targets/x86_64-linux/lib/stubs/libcuda.so" \
            "$RUNNER_TEMP/cuda-stubs/libcuda.so.1"
          {
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cuda-stubs:/usr/local/cuda-12.8/targets/x86_64-linux/lib/stubs:/usr/local/cuda-12.8/lib64"
          } >> "$GITHUB_ENV"

      - name: Build luce (smoke + server)
        run: |
          cd server
          gen=()
          command -v ninja >/dev/null && gen=(-G Ninja)
          cmake -B build "${gen[@]}" \
            -DCMAKE_CUDA_ARCHITECTURES="86" \
            -DLUCE_ENABLE_BSA=OFF \
            -DLUCE_FA_ALL_QUANTS=OFF \
            -DGGML_CCACHE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache \
            -DCMAKE_BUILD_TYPE=Release
          # Compile-only coverage for GPU/model tests the hosted runner can't run.
          cmake --build build --target \
            test_dflash test_generate test_model_smoke \
            test_concat_transpose test_kernel_qualification_gdn \
            test_kernel_qualification_moe_ds4 -j$(nproc)

      - name: Build and run C++ CPU unit tests
        # check-cpu builds every test labeled `cpu` in CMakeLists.txt and runs
        # `ctest -L cpu`, so a new CPU-safe test needs no edit here.
        run: cmake --build server/build --target check-cpu -j$(nproc)

  build-megakernel:
    name: Build megakernel (uv sync --extra megakernel)
    # Split out of `build` so megakernel's cu128 torch sync + CUDAExtension
    # builds run in parallel with C++ cmake and can be skipped when PRs don't
    # touch megakernel or Python workspace files.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.megakernel != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Add a last-resort Ubuntu mirror outside Canonical's DNS
        run: printf 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:4\n' | sudo tee -a /etc/apt/apt-mirrors.txt

      - uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          # Building megakernel's CUDAExtension links against torch's libs,
          # so CI uses the matching cu128 PyTorch wheel below.
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc", "cudart-dev", "thrust", "driver-dev"]'
          non-cuda-sub-packages: '["libcublas-dev"]'

      - name: Provide CUDA driver stub for hosted tests
        run: |
          mkdir -p "$RUNNER_TEMP/cuda-stubs"
          ln -sf "$CUDA_PATH/targets/x86_64-linux/lib/stubs/libcuda.so" \
            "$RUNNER_TEMP/cuda-stubs/libcuda.so.1"
          {
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cuda-stubs:/usr/local/cuda-12.8/targets/x86_64-linux/lib/stubs:/usr/local/cuda-12.8/lib64"
          } >> "$GITHUB_ENV"

      # Twice, as in uv-workspace: one slow read of uv's version list fails setup-uv.
      # Omit uv cache here so the ~2.5 GB cu128 torch wheel doesn't compete with
      # sccache for the 10 GB GHA cache quota (this job only runs when megakernel
      # or workspace deps change, and downloading torch takes ~25s).
      - id: setup-uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        continue-on-error: true
        with:
          version: "0.11.x"
      - if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.x"

      - name: Populate venv with cu128 torch + setuptools
        # First pass: install the workspace's default deps. luce declares
        # torch (which uv pulls from the pytorch-cu128 index per
        # [tool.uv.sources]) and pflash drags in setuptools. Megakernel is
        # in the optional `megakernel` extra so its build does NOT run yet.
        run: uv sync --frozen

      - name: Build megakernel via uv sync (sm_75)
        env:
          CUDA_HOME: ${{ env.CUDA_PATH }}
          MEGAKERNEL_CUDA_ARCH: sm_75
        # Second pass: builds megakernel against the venv populated above.
        # `no-build-isolation-package = ["qwen35-megakernel-bf16"]` (set in
        # the root pyproject.toml) forces setup.py to import the main env's
        # cu128 torch — same wheel that runtime will use, so the resulting
        # .so links against an ABI we can actually load.
        run: uv sync --frozen --extra megakernel

      - name: Verify megakernel extension imports
        run: |
          uv run --frozen --no-sync python -c "
          import torch
          import qwen35_megakernel_bf16_C as M
          print('megakernel sm_75 .so loads:', M.__file__)
          "

      - name: Rebuild megakernel via uv sync (sm_86)
        env:
          CUDA_HOME: ${{ env.CUDA_PATH }}
          MEGAKERNEL_CUDA_ARCH: sm_86
        # --reinstall-package forces uv to recompile the CUDAExtension
        # with the new MEGAKERNEL_CUDA_ARCH env var; without it, uv
        # would skip the already-installed package at the same version.
        run: uv sync --frozen --extra megakernel --reinstall-package qwen35-megakernel-bf16

      - name: Verify megakernel extension imports (sm_86)
        run: |
          uv run --frozen --no-sync python -c "
          import torch
          import qwen35_megakernel_bf16_C as M
          print('megakernel sm_86 .so loads:', M.__file__)
          "

  gpu-tests:
    name: ${{ matrix.job_name }}
    # Execute the shared CUDA verifier suite on both NVIDIA architectures.
    # Machine-specific labels prevent stale labels on another box from accepting
    # a job after a hardware change. The sparse-attention allocator smoke remains
    # 3090-only; all portable verifier tests are defined once below.
    #
    # SECURITY: fork PRs DO run here, but only after a maintainer approves the
    # workflow run. The repo enforces approval_policy=all_external_contributors,
    # so every push from an outside collaborator parks the run as
    # action_required until a maintainer reviews the diff and approves it.
    # That human checkpoint is the line of defense for the self-hosted box;
    # do not weaken the approval policy while this job runs fork code.
    # Gate only on the fast plan step, not uv-workspace or the hosted CPU build,
    # so NVIDIA verification starts immediately in parallel.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.dgx != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # TEMPORARY (2026-09-09): the lucebox-rtx3090 runner is offline
          # (NVIDIA driver not responding since 2026-09-07), so every run of
          # this entry fails before the checkout step. Restore the entry once
          # the runner is back.
          # - job_name: GPU tests (self-hosted RTX 3090, sm_86)
          #   runner: lucebox-rtx3090
          #   arch: "86"
          #   compute_cap: "8.6"
          - job_name: GPU tests (self-hosted DGX GB10, sm_121 verifier)
            runner: dgx-gb10
            arch: "121"
            compute_cap: "12.1"
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 20
    env:
      CUDA_HOME: /usr/local/cuda
      CUDACXX: /usr/local/cuda/bin/nvcc
      CUDA_ARCH: ${{ matrix.arch }}
      EXPECTED_COMPUTE_CAP: ${{ matrix.compute_cap }}
      CCACHE_MAXSIZE: 20G
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: time_macros,include_file_mtime
    # No job concurrency group: each GPU box has one runner, which already runs its
    # jobs one at a time, in order. A group keeps only one job waiting and cancels the
    # older one when a third run arrives, so a busy box lost queued jobs.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: GPU and CUDA smoke (${{ matrix.job_name }})
        run: |
          nvidia-smi --query-gpu=name,compute_cap,driver_version,memory.total,power.limit --format=csv
          test "$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | tr -d '[:space:]')" = "$EXPECTED_COMPUTE_CAP"
          "$CUDACXX" --version

      - name: Build focused NVIDIA verifier tests (sm_${{ matrix.arch }})
        run: |
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          cd server
          gen=()
          command -v ninja >/dev/null && gen=(-G Ninja)
          cmake -B build "${gen[@]}" \
            -DCMAKE_CUDA_COMPILER="$CUDACXX" \
            -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCH" \
            -DLUCE_USER_CUDA_ARCHITECTURES="$CUDA_ARCH" \
            -DLUCE_ENABLE_BSA=OFF \
            -DLUCE_FA_ALL_QUANTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          if [[ "$CUDA_ARCH" == "121" ]]; then
            grep -q '^LUCE_EFFECTIVE_BLACKWELL_CONSUMER:INTERNAL=OFF$' build/CMakeCache.txt
          fi
          targets=(
            test_server_unit
            test_cuda_pool_shutdown
            test_deepseek4_mmid_grouped_cuda
            test_deepseek4_unit
            test_rocmfp3_mix_registry
            test_rocmfp_mix_slice_matvec
            test_rocmfp_mix_gateup_glu
            test_ds4_mix_registry_teardown
            test_ggml_cluster_allreduce
            test_capture_safe_copies
            test_model_smoke
            test_batched_gdn
            test_gdn_replay_log
            test_kernel_qualification_core
            test_kernel_qualification_gdn
            test_kernel_qualification_moe_ds4
            test_concat_transpose
            test_cuda_copy_batch
            test_ds4_fused_ops_cuda
            test_qn_split_fusions
          )
          cmake --build build --target "${targets[@]}" -j"$(nproc)"
          command -v ccache >/dev/null && ccache -s || true

      - name: Run focused NVIDIA verifier tests
        run: |
          ./server/build/test_deepseek4_mmid_grouped_cuda
          ./server/build/test_deepseek4_unit
          ./server/build/test_ds4_fused_ops_cuda
          ctest --test-dir server/build --output-on-failure \
            -R 'cuda_pool_shutdown|rocmfp3_mix_registry|rocmfp_mix_slice_matvec|rocmfp_mix_gateup_glu|ds4_mix_registry_teardown|ggml_cluster_allreduce|test_cuda_copy_batch\.|test_cuda_copy_batch_disabled$'

      - name: Run GPU sampler and draft top-K tests
        # Invoke the CppUnit binary directly so all matching cases share one
        # CUDA context instead of paying ~0.43s cold init per test case.
        # CppUnit exits non-zero (77) if 0 cases pass.
        run: |
          ./server/build/test_server_unit GpuSamplerCudaFixture:: DraftTopkCudaFixture::

      - name: Run KVFlash GPU scorer and fused chunk-mass kernel tests
        run: |
          ./server/build/test_server_unit KvflashFusedMassFixture:: KvflashGpuMassFixture::

      - name: Run capture-safe copy test
        run: ./server/build/test_capture_safe_copies

      - name: Run Qwen3.8 split fusion parity test
        run: ./server/build/test_qn_split_fusions

      - name: Run concurrent-serving kernel tests
        run: |
          ./server/build/test_kernel_qualification_core
          # Keep PagedAttention in ctest so DirectPath cases get fresh
          # processes for their process-cached FORCE_PARTITIONS override.
          ctest --test-dir server/build --output-on-failure \
            -R '^(test_model_smoke\.PagedAttention\.|batched_gdn$|gdn_replay_log_preflight$|kernel_qualification_gdn$|kernel_qualification_moe_ds4$|concat_transpose$)' --no-tests=error

      # Optional model-backed end-to-end smoke (real spec-decode on the 3090),
      # disabled by default because it builds luce_server and lazy-loads the
      # ~16 GB Qwen3.6-27B target + draft (~1-2 min). The weights are already
      # staged at /opt/models on lucebox-rtx3090 (override with repo var
      # LUCEBOX_MODELS_DIR). Verified working on the runner. To enable, uncomment;
      # continue-on-error keeps a heavy/slow run from ever blocking a PR.
      # - name: luce end-to-end smoke (model-backed)
      #   continue-on-error: true
      #   env:
      #     MODELS: ${{ vars.LUCEBOX_MODELS_DIR || '/opt/models' }}
      #   run: |
      #     cd server
      #     cmake --build build --target luce_server -j"$(nproc)"
      #     ./build/luce_server "$MODELS/Qwen3.6-27B-Q4_K_M.gguf" \
      #       --draft "$MODELS/draft/dflash-draft-3.6-q4_k_m.gguf" --port 8099 &
      #     SRV=$!; trap 'kill $SRV 2>/dev/null' EXIT
      #     for i in $(seq 1 90); do curl -sf localhost:8099/v1/models >/dev/null && break; sleep 2; done
      #     curl -sf --max-time 240 localhost:8099/v1/completions \
      #       -H 'Content-Type: application/json' \
      #       -d '{"prompt":"The capital of France is","max_tokens":8}' | grep -q '"text"'

  gpu-tests-amd:
    name: GPU tests (${{ matrix.device_name }}, ${{ matrix.arch }} / ROCm)
    # Companion to the NVIDIA jobs: lucebox3 carries both an R9700 and the Strix
    # Halo iGPU. Run the same HIP suite once per device with an explicit visibility
    # mask. GitHub-hosted runners cannot execute these kernels.
    # hipcc is not on the runner's minimal PATH, so invoke it by absolute path.
    #
    # SECURITY: same model as gpu-tests - fork PRs run only after a maintainer
    # approves the workflow run (approval_policy=all_external_contributors).
    # Gate only on the fast plan step so ROCm jobs start in parallel with
    # uv-workspace. The two AMD matrix jobs share one physical runner and
    # therefore execute one at a time.
    # !cancelled() keeps a failed plan from skipping the job: it then runs.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.gpu != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_name: Radeon AI PRO R9700
            arch: gfx1201
            device_index: "0"
          - device_name: Strix Halo Radeon 8060S
            arch: gfx1151
            device_index: "1"
    runs-on: [self-hosted, lucebox3]
    # Up to 120 minutes waiting for development work on the box, and room to
    # rerun steps stopped for it (.github/ci/box_step.sh). Lightweight setup and
    # health checks run immediately outside box_step.sh; heavy ROCm builds and
    # GPU tests stay inside box_step.sh because Strix Halo shares system RAM
    # with the iGPU (yielding avoids OOM-killing dev workloads, keeps OOM retry,
    # and ccache preserves already-compiled objects across yields).
    timeout-minutes: 180
    env:
      BOX_WAIT_MINUTES: 120
      # Each run of a GPU test step.
      BOX_STEP_MINUTES: 20
      HIP_VISIBLE_DEVICES: ${{ matrix.device_index }}
      EXPECTED_HIP_ARCH: ${{ matrix.arch }}
      CCACHE_MAXSIZE: 30G
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: time_macros,include_file_mtime
      # The models this box serves: Qwen 3.8 27B (qwen35 architecture, as the target
      # loader expects) and DeepSeek V4.1 Flash's DSpark drafter (the 383 GB model
      # itself runs only across both GPUs; serve-smoke-amd below serves it).
      LUCE_TEST_MODEL_QWEN35: /opt/models/Qwen3.8-27B-UD-IQ4_XS.gguf
      LUCE_TEST_MODEL_DEEPSEEK41_DRAFT: /opt/models/DeepSeek-V4.1-Flash-1017-DSpark-draft-MXFP4-Q8.gguf
    # Collapse queued main pushes per arch (at most one active + one pending) so
    # rapid merges don't pile redundant lucebox3 builds, while keeping each PR
    # run in its own group so PRs never cancel one another on lucebox3.
    concurrency:
      group: ${{ github.event_name == 'push' && format('lucebox3-main-{0}', matrix.arch) || format('lucebox3-run-{0}-{1}', github.run_id, matrix.arch) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Ensure local ccache is available
        run: |
          cache_dir="$HOME/.cache/lucebox-ci-ccache"
          mkdir -p "$HOME/.local/bin" "$cache_dir"
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if ! command -v ccache >/dev/null && [ ! -x "$HOME/.local/bin/ccache" ]; then
            url="https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-linux-x86_64-musl-static.tar.xz"
            sha="d553fac006ed93a37342cee9228cf4e13dd66690fa1a8075c54c7bace9b72ae6"
            tmp="$RUNNER_TEMP/ccache.tar.xz"
            curl -fsSL "$url" -o "$tmp"
            echo "$sha  $tmp" | sha256sum -c -
            tar -xJf "$tmp" -C "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/ccache-4.14.3-linux-x86_64-musl-static/ccache" "$HOME/.local/bin/ccache"
            chmod +x "$HOME/.local/bin/ccache"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ccache" --version 2>/dev/null || ccache --version

      - name: KFD health (diagnose instead of hanging)
        # rocminfo on a wedged KFD blocks in uninterruptible sleep and eats
        # the whole job timeout. Probe with a hard timeout first,
        # and when it hangs, dump the evidence (D-state holders, dmesg) so
        # the job fails in seconds with a diagnosis instead of silently.
        run: |
          # A wedged KFD puts rocminfo in UNINTERRUPTIBLE sleep: timeout(1)
          # cannot kill it and a foreground wait blocks until the job
          # timeout. Probe in the background (output to a file so no pipe
          # keeps the step alive) and enforce the deadline in the shell.
          /opt/rocm/bin/rocminfo > /tmp/rocminfo.out 2>&1 &
          PROBE=$!
          for i in $(seq 1 15); do
            kill -0 $PROBE 2>/dev/null || break
            sleep 1
          done
          if kill -0 $PROBE 2>/dev/null; then
            echo "::error::rocminfo hung (likely D-state) — ROCm/KFD wedged; the box needs a reboot"
            echo "--- probe state:"
            ps -o pid,stat,wchan:32,comm -p $PROBE || true
            echo "--- processes holding /dev/kfd:"
            sudo fuser -v /dev/kfd 2>&1 || true
            echo "--- D-state processes:"
            ps -eo pid,user,stat,wchan:32,comm | awk '$3 ~ /D/' || true
            echo "--- recent amdgpu/kfd dmesg:"
            sudo dmesg 2>/dev/null | grep -iE "amdgpu|kfd" | tail -15 || true
            kill -9 $PROBE 2>/dev/null || true
            disown $PROBE 2>/dev/null || true
            exit 1
          fi
          wait $PROBE && echo "KFD healthy" || { echo "::error::rocminfo exited non-zero"; cat /tmp/rocminfo.out | tail -5; exit 1; }

      - name: ROCm inventory includes ${{ matrix.arch }}
        run: cat /tmp/rocminfo.out | grep -E "Name:|Marketing Name:" | grep -F "${{ matrix.arch }}"

      - name: Build HIP vector-add on ${{ matrix.device_name }}
        run: |
          /opt/rocm/bin/hipcc --offload-arch="$EXPECTED_HIP_ARCH" -O2 \
            -o "$RUNNER_TEMP/hip_smoke" .github/ci/hip_smoke.cpp

      - name: Run HIP vector-add on ${{ matrix.device_name }}
        # Self-contained HIP kernel correctness test (no model weights). This is
        # the execution the GitHub-hosted jobs cannot do. The binary also checks
        # that HIP_VISIBLE_DEVICES selected the matrix's expected architecture.
        shell: bash .github/ci/box_step.sh {0}
        run: |
          "$RUNNER_TEMP/hip_smoke" "$EXPECTED_HIP_ARCH"

      - name: Build ROCm formats and inference core
        shell: bash .github/ci/box_step.sh {0}
        env:
          BOX_STEP_MINUTES: 30
        run: |
          gen=()
          command -v ninja >/dev/null && gen=(-G Ninja)
          avail_gib=$(awk '/^MemAvailable:/ { printf "%d", $2 / 1048576 }' /proc/meminfo)
          jobs=$(nproc)
          mem_jobs=$(( avail_gib / 3 ))
          if (( mem_jobs < jobs )); then jobs=$mem_jobs; fi
          if (( jobs < 2 )); then jobs=2; fi
          ld_flags=()
          command -v ld.lld >/dev/null && ld_flags=(-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld)
          cmake -S server -B "$RUNNER_TEMP/rocmfp-build" "${gen[@]}" "${ld_flags[@]}" \
            -DLUCE_GPU_BACKEND=hip \
            -DLUCE_HIP_ARCHITECTURES="$EXPECTED_HIP_ARCH" \
            -DLUCE_SERVER=OFF \
            -DLUCE_TESTS=ON \
            -DLUCE_FA_ALL_QUANTS=OFF \
            -DGGML_HIP_GRAPHS=ON \
            -DGGML_CCACHE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_HIP_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_HIP_FLAGS=-DLUCE_WAVE_SIZE=32
          cmake --build "$RUNNER_TEMP/rocmfp-build" \
            --target test_rocmfp4 test_rocmfpx test_rocmfp4_hip_tail test_rocmfpx_mmq \
              test_deepseek4_mmid_grouped_cuda test_deepseek4_unit \
              test_ds4_moe_combine_cuda test_ds4_fused_ops_cuda test_ds4_maskless_prefill \
              test_recurrent_snapshot test_server_unit test_draft_topk_cuda test_rocmfp3_mix_registry \
              test_rocmfp_mix_slice_matvec test_rocmfp_mix_gateup_glu \
              test_ds4_mix_registry_teardown test_ds4_dspark_load \
              test_model_smoke test_batched_gdn \
              test_kernel_qualification_core test_kernel_qualification_gdn \
              test_kernel_qualification_moe_ds4 \
              test_concat_transpose test_cuda_pool_shutdown test_fattn_mma256 test_capture_safe_copies \
              test_ggml_cluster_allreduce \
              test_paged_attn_wmma test_cuda_copy_batch test_ds41_mmid_width_invariance \
              test_qwen4exp_qsa_ids test_qwen4exp_indexer_score test_rope_tail \
              test_mmb_cublas_diff test_convert_vec test_getrows_scalar \
              test_rms_norm_scale test_mul_mat_host_input test_mmid_regression test_qn_split_fusions \
            --parallel "$jobs"
          ccache -s

      - name: Test ROCm formats and inference core
        shell: bash .github/ci/box_step.sh {0}
        run: |
          # Run CppUnit suites directly so cases in each binary share one HIP
          # context instead of spawning ~130 separate processes. CppUnit exits
          # non-zero (77) if 0 cases pass.
          b="$RUNNER_TEMP/rocmfp-build"
          "$b/test_server_unit" \
            ChainRollbackPolicyFixture:: KvflashFusedMassFixture:: \
            KvflashGpuMassFixture:: MmqTileSelection:: \
            MixedMmqPolicy:: MoeHybridStorageFixture::
          "$b/test_qn_split_fusions"
          "$b/test_recurrent_snapshot"
          "$b/test_kernel_qualification_core"
          "$b/test_rocmfp3_mix_registry"
          "$b/test_rocmfp_mix_slice_matvec"
          "$b/test_rocmfp_mix_gateup_glu"
          "$b/test_ds4_mix_registry_teardown"
          "$b/test_ggml_cluster_allreduce"
          "$b/test_cuda_copy_batch"
          "$b/test_rope_tail"
          # Keep PagedAttention in ctest so DirectPath cases get fresh
          # processes for their process-cached FORCE_PARTITIONS override.
          ctest --test-dir "$b" \
            --output-on-failure --no-tests=error \
            -R 'cuda_pool_shutdown|rocmfp4_reference|rocmfpx_reference|rocmfp4_hip_tail|rocmfpx_mmq|deepseek4_mmid_grouped_cuda|deepseek4_unit|ds4_moe_combine_cuda|ds4_fused_ops_cuda|ds4_maskless_prefill|test_model_smoke\.PagedAttention\.|batched_gdn$|kernel_qualification_gdn$|kernel_qualification_moe_ds4$|concat_transpose$|test_fattn_mma256$|test_paged_attn_wmma$|paged_attn_vdot2_route$|test_cuda_copy_batch_disabled$|test_ds41_mmid_width_invariance$|test_qwen4exp_qsa_ids$|test_qwen4exp_indexer_score$|test_mmb_cublas_diff$|test_convert_vec$|test_getrows_scalar$|test_rms_norm_scale$|test_mul_mat_host_input$|test_mmid_regression$'

      - name: Run GPU draft top-K tests
        shell: bash .github/ci/box_step.sh {0}
        run: |
          ctest --test-dir "$RUNNER_TEMP/rocmfp-build" --output-on-failure \
            -R '^draft_topk_cuda$' --no-tests=error

      - name: Run capture-safe copy test
        shell: bash .github/ci/box_step.sh {0}
        run: |
          "$RUNNER_TEMP/rocmfp-build/test_capture_safe_copies"

      - name: Model files are on the box
        # A model-backed test skips, and the step passes, when its file is missing:
        # Qwen 3.6's smoke load skipped that way on every run once the file was gone.
        run: |
          for model in "$LUCE_TEST_MODEL_QWEN35" "$LUCE_TEST_MODEL_DEEPSEEK41_DRAFT"; do
            [ -r "$model" ] || { echo "::error::$model is missing or not readable by $(id -un)"; exit 1; }
          done

      - name: Run model-backed ROCm tests
        if: matrix.arch == 'gfx1151'
        shell: bash .github/ci/box_step.sh {0}
        run: |
          ctest --test-dir "$RUNNER_TEMP/rocmfp-build" \
            --output-on-failure \
            -R '^test_model_smoke\.SmokeLoadTarget\.LoadsConfiguredModel$' \
            --no-tests=error

      - name: Load DeepSeek V4.1's DSpark drafter and run its forward
        # The drafter's bindings and a forward that must come out finite, on each GPU.
        shell: bash .github/ci/box_step.sh {0}
        run: |
          "$RUNNER_TEMP/rocmfp-build/test_ds4_dspark_load" "$LUCE_TEST_MODEL_DEEPSEEK41_DRAFT"

      - name: Build affine ROCmFP2 GPU paths
        # Keep the default wire-format build above and compile the affine layout
        # separately so both configurations remain covered. The focused tests
        # assert real MMVQ/MMQ dispatch rather than accepting a BLAS fallback.
        shell: bash .github/ci/box_step.sh {0}
        run: |
          gen=()
          command -v ninja >/dev/null && gen=(-G Ninja)
          avail_gib=$(awk '/^MemAvailable:/ { printf "%d", $2 / 1048576 }' /proc/meminfo)
          jobs=$(nproc)
          mem_jobs=$(( avail_gib / 3 ))
          if (( mem_jobs < jobs )); then jobs=$mem_jobs; fi
          if (( jobs < 2 )); then jobs=2; fi
          ld_flags=()
          command -v ld.lld >/dev/null && ld_flags=(-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld)
          cmake -S server -B "$RUNNER_TEMP/rocmfp-affine-build" "${gen[@]}" "${ld_flags[@]}" \
            -DLUCE_GPU_BACKEND=hip \
            -DLUCE_HIP_ARCHITECTURES="$EXPECTED_HIP_ARCH" \
            -DLUCE_SERVER=OFF \
            -DLUCE_TESTS=ON \
            -DLUCE_FA_ALL_QUANTS=OFF \
            -DLUCE_ROCMFP2_AFFINE=ON \
            -DGGML_HIP_GRAPHS=ON \
            -DGGML_CCACHE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_HIP_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_HIP_FLAGS=-DLUCE_WAVE_SIZE=32
          cmake --build "$RUNNER_TEMP/rocmfp-affine-build" \
            --target test_rocmfpx test_rocmfpx_mmq \
              test_deepseek4_mmid_grouped_cuda \
            --parallel "$jobs"
          ccache -s

      - name: Test affine ROCmFP2 GPU paths
        shell: bash .github/ci/box_step.sh {0}
        run: |
          ctest --test-dir "$RUNNER_TEMP/rocmfp-affine-build" \
            --output-on-failure \
            -R 'rocmfpx_reference|rocmfpx_mmq|deepseek4_mmid_grouped_cuda'

  serve-smoke-amd:
    name: Serve Qwen 3.8 27B and DeepSeek V4.1 Flash (lucebox3 / ROCm)
    # The two models lucebox3 serves, started as Lucebox Manage starts them, each
    # asked to count to 30 with its drafter's drafts accepted (.github/ci/serve_smoke.sh).
    # Qwen 3.8 27B runs on the R9700 with the DFlash2 drafter, eight at once. DeepSeek
    # V4.1 Flash is 383 GB, so it runs only across both GPUs and the SSD (the
    # ds41-halo profile), with the DSpark drafter; it replaces the V4 the per-device
    # job loaded for ds4_load_transactional, a qtype-105 load V4.1 files (qtype 107)
    # cannot run. After gpu-tests-amd on the same runner, so a kernel failure stops it
    # before the model loads. Each model's step runs when plan says the
    # change can affect it.
    needs: [gpu-tests-amd, plan]
    if: >-
      ${{ !cancelled() && needs.gpu-tests-amd.result == 'success' &&
      (needs.plan.outputs.qwen38 != 'false' || needs.plan.outputs.ds41 != 'false') }}
    runs-on: [self-hosted, lucebox3]
    # Up to 120 minutes waiting for development work on the box, and room to
    # rerun GPU serve steps stopped for it (.github/ci/box_step.sh).
    timeout-minutes: 210
    env:
      BOX_WAIT_MINUTES: 120
      # Each run of a serve step.
      BOX_STEP_MINUTES: 45
      CCACHE_MAXSIZE: 30G
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: time_macros,include_file_mtime
      LUCE_TEST_MODEL_QWEN38: /opt/models/Qwen3.8-27B-UD-IQ4_XS.gguf
      LUCE_TEST_MODEL_QWEN38_DRAFT: /opt/models/Qwen3.8-27B-DFlash2-Q8_0.gguf
      LUCE_TEST_MODEL_DEEPSEEK41: /opt/models/DeepSeek-V4.1-Flash-1017-ROCMFP2S-IM1017.gguf
      LUCE_TEST_MODEL_DEEPSEEK41_DRAFT: /opt/models/DeepSeek-V4.1-Flash-1017-DSpark-draft-MXFP4-Q8.gguf
    # No job concurrency group, as in gpu-tests: lucebox3's one runner queues its jobs
    # (and gpu-tests-amd above already collapses queued main pushes).
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Ensure local ccache is available
        run: |
          cache_dir="$HOME/.cache/lucebox-ci-ccache"
          mkdir -p "$HOME/.local/bin" "$cache_dir"
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if ! command -v ccache >/dev/null && [ ! -x "$HOME/.local/bin/ccache" ]; then
            url="https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-linux-x86_64-musl-static.tar.xz"
            sha="d553fac006ed93a37342cee9228cf4e13dd66690fa1a8075c54c7bace9b72ae6"
            tmp="$RUNNER_TEMP/ccache.tar.xz"
            curl -fsSL "$url" -o "$tmp"
            echo "$sha  $tmp" | sha256sum -c -
            tar -xJf "$tmp" -C "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/ccache-4.14.3-linux-x86_64-musl-static/ccache" "$HOME/.local/bin/ccache"
            chmod +x "$HOME/.local/bin/ccache"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build luce_server for the R9700 and the Strix Halo
        # The build server/docs/DS41.md gives for this recipe. PRs compile with
        # FA_ALL_QUANTS=OFF for speed; main/merge_group/dispatch keep the default
        # ON so full mixed-quant HIP FlashAttention retains CI compile coverage.
        shell: bash .github/ci/box_step.sh {0}
        env:
          FA_ALL_QUANTS: ${{ github.event_name == 'pull_request' && 'OFF' || 'ON' }}
        run: |
          gen=()
          command -v ninja >/dev/null && gen=(-G Ninja)
          avail_gib=$(awk '/^MemAvailable:/ { printf "%d", $2 / 1048576 }' /proc/meminfo)
          jobs=$(nproc)
          mem_jobs=$(( avail_gib / 3 ))
          if (( mem_jobs < jobs )); then jobs=$mem_jobs; fi
          if (( jobs < 2 )); then jobs=2; fi
          ld_flags=()
          command -v ld.lld >/dev/null && ld_flags=(-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld)
          cmake -S server -B "$RUNNER_TEMP/serve-build" "${gen[@]}" "${ld_flags[@]}" \
            -DLUCE_GPU_BACKEND=hip \
            -DLUCE_HIP_ARCHITECTURES='gfx1151;gfx1201' \
            -DCMAKE_HIP_ARCHITECTURES='gfx1151;gfx1201' \
            -DLUCE_FA_ALL_QUANTS="$FA_ALL_QUANTS" \
            -DGGML_CCACHE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_HIP_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/serve-build" --target luce_server --parallel "$jobs"
          ccache -s

      - name: Serve Qwen 3.8 27B with DFlash2, eight at once
        # The model card's default profile on the R9700 (qwen38-r9700, a
        # 204,800-token context) with Lucebox Manage's batching on top.
        if: needs.plan.outputs.qwen38 != 'false'
        shell: bash .github/ci/box_step.sh {0}
        env:
          SERVE_SMOKE_PROFILE: qwen38-r9700
        run: |
          .github/ci/serve_smoke.sh qwen3.8-27b 8 "$RUNNER_TEMP/serve-build/luce_server" \
            "$LUCE_TEST_MODEL_QWEN38" --draft "$LUCE_TEST_MODEL_QWEN38_DRAFT" \
            --paged-attention --max-concurrency 8 --kv-pool-tokens 204800

      - name: Serve DeepSeek V4.1 Flash with DSpark
        # The model card's default profile on the Lucebox (ds41-halo).
        if: needs.plan.outputs.ds41 != 'false'
        shell: bash .github/ci/box_step.sh {0}
        env:
          SERVE_SMOKE_PROFILE: ds41-halo
        run: |
          .github/ci/serve_smoke.sh deepseek-v4.1-flash 1 "$RUNNER_TEMP/serve-build/luce_server" \
            "$LUCE_TEST_MODEL_DEEPSEEK41" --draft "$LUCE_TEST_MODEL_DEEPSEEK41_DRAFT"

  build-windows:
    name: Build Windows (MSVC + CUDA, library + server targets)
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.windows != 'false' }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64

      - name: Set up CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76 # v0.2.35
        with:
          cuda: '12.8.0'
          method: network
          # Windows installer component names differ from the Linux apt
          # packages used by the hosted Ubuntu job above.
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust"]'

      - name: Configure (cmake)
        working-directory: server
        shell: cmd
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CUDA_ARCHITECTURES="75" ^
            -DLUCE_ENABLE_BSA=OFF ^
            -DLUCE_FA_ALL_QUANTS=OFF ^
            -DGGML_CCACHE=OFF ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe"

      - name: Build Windows targets
        working-directory: server
        shell: cmd
        run: cmake --build build --target luce_common luce_server backend_ipc_daemon test_platform_compat -j 4

      - name: Run Windows platform smoke test
        working-directory: server
        shell: cmd
        run: ctest --test-dir build -R "^test_platform_compat[.]" --output-on-failure --no-tests=error

      - name: Verify build outputs
        shell: pwsh
        run: |
          $lib = Get-ChildItem server/build -Recurse -Filter "luce_common.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lib) {
            Write-Error "luce_common.lib not found in build output"
            exit 1
          }
          Write-Host "Built: $($lib.FullName)"
          Write-Host "Size: $([math]::Round($lib.Length / 1MB, 2)) MB"

          foreach ($binaryName in @("luce_server.exe", "backend_ipc_daemon.exe")) {
            $binary = Get-ChildItem server/build -Recurse -Filter $binaryName -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $binary) {
              Write-Error "$binaryName not found in build output"
              exit 1
            }
            Write-Host "Built: $($binary.FullName)"
          }

  build-windows-hip:
    # The Windows build above compiles CUDA only. This one compiles the HIP backend
    # with AMD's ROCm SDK for Windows (pip wheels), where clang resolves some calls
    # differently than on Linux (#944: std::memcpy inside a __global__ function).
    # Compile and link only: GitHub-hosted runners have no AMD GPU.
    name: Build Windows (ROCm HIP, server targets)
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.windows != 'false' }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      ROCM_VERSION: 10.0.0
      HIP_ARCH: gfx1201
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_MULTIARCH: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Set up MSVC Developer Command Prompt
        # clang targets the MSVC ABI and needs its headers, libraries and linker.
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install the ROCm ${{ env.ROCM_VERSION }} SDK for ${{ env.HIP_ARCH }}
        # AMD's install guide for Windows: rocm[libraries,devel] from the stable
        # wheel index, then rocm-sdk init unpacks the SDK (clang, HIP headers,
        # hipBLAS, rocBLAS) under site-packages/_rocm_sdk_devel.
        shell: pwsh
        run: |
          # A short root: hipBLASLt's kernel file names run close to the Windows path limit.
          $venv = "$env:RUNNER_TEMP\r"
          python -m venv $venv
          # One retry: a file write in the 4 GB unpack can fail transiently (OSError 22).
          foreach ($attempt in 1, 2) {
            & "$venv\Scripts\python.exe" -m pip install --no-cache-dir `
              --index-url https://stable.repo.amd.com/rocm/whl-next/ `
              "rocm[libraries,devel,device-$env:HIP_ARCH]==$env:ROCM_VERSION"
            if (-not $LASTEXITCODE) { break }
            if ($attempt -eq 2) { exit $LASTEXITCODE }
            Write-Host "pip install failed, retrying once"
          }
          & "$venv\Scripts\rocm-sdk.exe" init
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = (& "$venv\Scripts\rocm-sdk.exe" path --root).Trim()
          $llvm = Join-Path $root "lib\llvm"
          if (-not (Test-Path (Join-Path $llvm "bin\clang++.exe"))) {
            Write-Error "clang++.exe not found under $llvm\bin"
            exit 1
          }
          Write-Host "ROCm SDK: $root"
          & (Join-Path $llvm "bin\clang++.exe") --version
          "HIP_PATH=$root" >> $env:GITHUB_ENV
          "ROCM_PATH=$root" >> $env:GITHUB_ENV
          "HIP_PLATFORM=amd" >> $env:GITHUB_ENV
          "HIP_DEVICE_LIB_PATH=$llvm\amdgcn\bitcode" >> $env:GITHUB_ENV
          "LLVM_BIN=$llvm\bin" >> $env:GITHUB_ENV
          (Join-Path $root "bin") >> $env:GITHUB_PATH
          "$llvm\bin" >> $env:GITHUB_PATH

      - name: Configure (cmake)
        # On Windows ggml compiles its HIP sources as C++ through hip::device, which
        # takes its --offload-arch from GPU_TARGETS; unset, it falls back to gfx906.
        # ggml's HIP CMake finds hip, hipBLAS and rocBLAS from ROCM_PATH. The SDK's
        # own nlohmann_json package points at a missing nlohmann_json.natvis, so
        # the build skips it and downloads the pinned copy it uses everywhere else.
        shell: pwsh
        run: |
          $clang = "$env:LLVM_BIN\clang.exe" -replace '\\', '/'
          $clangxx = "$env:LLVM_BIN\clang++.exe" -replace '\\', '/'
          cmake -S server -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLUCE_GPU_BACKEND=hip `
            -DLUCE_HIP_ARCHITECTURES="$env:HIP_ARCH" `
            -DGPU_TARGETS="$env:HIP_ARCH" `
            -DLUCE_FA_ALL_QUANTS=OFF `
            -DGGML_CCACHE=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_HIP_COMPILER_LAUNCHER=sccache `
            -DCMAKE_C_COMPILER="$clang" `
            -DCMAKE_CXX_COMPILER="$clangxx" `
            -DCMAKE_HIP_COMPILER="$clangxx" `
            -DCMAKE_DISABLE_FIND_PACKAGE_nlohmann_json=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build Windows HIP targets
        shell: pwsh
        run: cmake --build build --target luce_server backend_ipc_daemon pflash_daemon -j 4

      - name: Verify build outputs
        shell: pwsh
        run: |
          foreach ($binaryName in @("luce_server.exe", "backend_ipc_daemon.exe", "pflash_daemon.exe")) {
            $binary = Get-ChildItem build -Recurse -Filter $binaryName -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $binary) {
              Write-Error "$binaryName not found in build output"
              exit 1
            }
            Write-Host "Built: $($binary.FullName) ($([math]::Round($binary.Length / 1MB, 1)) MB)"
          }
